[package]
name = "krk-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
# Mocked node logic to bypass ring/rustls compilation issues on ARM64
krk-sat = { path = "../krk-sat" }
krk-state = { path = "../krk-state" }

# Serialization & Utils
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.34", features = ["full"] }
rand = "0.8"
blake3 = "1.5"
