[package]
name = "krk-adversarial-bench"
version = "0.1.0"
edition = "2021"

# Self-contained: only depends on krk-algebra + krk-psc (serde + sha2).
# No transitive dependency on `ring` or any C compiler.
[dependencies]
krk-algebra = { path = "../krk-algebra" }
krk-psc = { path = "../krk-psc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
