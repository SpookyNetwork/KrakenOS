[package]
name = "krk-dcmp"
version = "0.1.0"
edition = "2021"

[features]
default = []
transport = ["quinn", "rustls", "tokio"]

[dependencies]
# Transport (optional — only needed for actual QUIC networking)
quinn = { version = "0.10", optional = true }
rustls = { version = "0.21", optional = true }
tokio = { version = "1.34", features = ["full"], optional = true }

# Cryptography & Serialization
serde = { version = "1.0", features = ["derive"] }
postcard = "1.0"
bytes = "1.5"
